<meta charset="UTF-8">
<title>Timing Light</title>
<style>
  :root{
    --ground:#0b0e10;
    --panel:#12161890;
    --bezel:#1d2224;
    --text:#e9ece8;
    --muted:#7c8a85;
    --hair:#262c2e;
    --green:#3ddc84;
    --green-dim:#1c4a33;
    --amber:#ffc53d;
    --amber-dim:#4a3a12;
    --red:#ff4d4d;
    --red-dim:#4a1414;
    --focus:#8fd9ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ground);
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    padding-block:32px;
  }
  a,button{font-family:inherit;}
  .console{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .brand b{color:var(--text);font-weight:700;letter-spacing:.1em;}

  .facepanel{
    width:100%;
    background:linear-gradient(180deg,#15191b,#101314);
    border:1px solid var(--bezel);
    border-radius:20px;
    padding:clamp(20px,5vw,44px);
    box-shadow:0 1px 0 #262c2e inset, 0 20px 50px -25px #000;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  .lights{
    display:flex;
    gap:22px;
  }
  .light{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .bulb{
    width:16px;height:16px;border-radius:50%;
    background:var(--hair);
    box-shadow:inset 0 1px 2px #000;
    transition:box-shadow .25s ease, background .25s ease;
  }
  .bulb.on.g{background:var(--green);box-shadow:0 0 14px 3px var(--green);}
  .bulb.on.a{background:var(--amber);box-shadow:0 0 14px 3px var(--amber);}
  .bulb.on.r{background:var(--red);box-shadow:0 0 14px 3px var(--red);}
  .light span{font-size:11px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;}
  .light.active span{color:var(--text);}

  .display{
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:8px 4px;
    border-radius:14px;
    outline:none;
  }
  .display:focus-visible{box-shadow:0 0 0 3px var(--focus);}
  .clock{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-weight:700;
    font-size:clamp(64px,17vw,132px);
    line-height:1;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    color:var(--text);
    text-shadow:0 0 30px currentColor;
    transition:color .3s ease;
  }
  .clock.g{color:var(--green);}
  .clock.a{color:var(--amber);}
  .clock.r{color:var(--red);}
  .clock.over{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }
  @media (prefers-reduced-motion:reduce){ .clock.over{animation:none;} }

  .hint{font-size:12px;color:var(--muted);letter-spacing:.04em;}

  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }
  button.ctl{
    appearance:none;
    border:1px solid var(--bezel);
    background:#14181a;
    color:var(--text);
    padding:10px 18px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    transition:border-color .15s ease, transform .05s ease;
  }
  button.ctl:hover{border-color:#3a4245;}
  button.ctl:active{transform:translateY(1px);}
  button.ctl:focus-visible{box-shadow:0 0 0 3px var(--focus);}
  button.ctl.primary{background:var(--green-dim);border-color:#2c6b48;}
  button.ctl[aria-pressed="true"]{border-color:var(--focus);}
  button.ctl svg{vertical-align:-3px;margin-right:6px;}

  .soundpanel{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    background:#14181a;
    border:1px solid var(--bezel);
    border-radius:10px;
    padding:12px 16px;
  }
  .soundpanel.muted{opacity:.45;}
  .volrow{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1 1 160px;
  }
  .volrow label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--hair);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--focus);cursor:pointer;
    box-shadow:0 0 0 3px #0b0e10;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;border:none;
    background:var(--focus);cursor:pointer;
  }
  input[type="range"]:focus-visible{outline:2px solid var(--focus);}
  #volLabel{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--text);width:34px;text-align:right;font-variant-numeric:tabular-nums;}

  select.toneSelect{
    background:#0f1315;
    color:var(--text);
    border:1px solid var(--bezel);
    border-radius:8px;
    padding:7px 10px;
    font-size:13px;
    font-family:inherit;
  }
  select.toneSelect:focus-visible{outline:2px solid var(--focus);}
  #customName{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fileBtn{
    position:relative;
    overflow:hidden;
  }
  .fileBtn input[type="file"]{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;
  }

  .settings{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:#14181a;
    border:1px solid var(--bezel);
    border-radius:10px;
    padding:10px 12px;
  }
  .field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .field input{
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:16px;
    width:100%;
    font-variant-numeric:tabular-nums;
  }
  .field input:focus-visible{outline:2px solid var(--focus);border-radius:4px;}
  .field.g{border-color:#2c6b48;}
  .field.a{border-color:#8a6a1f;}
  .field.r{border-color:#8a2c2c;}

  .foot{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:12px;
  }
  .foot code{color:var(--text);background:#14181a;border:1px solid var(--bezel);padding:1px 6px;border-radius:5px;font-family:'JetBrains Mono',ui-monospace,monospace;}

  #pipCanvas{display:none;}
  #pipVideo{position:fixed;bottom:-200px;width:2px;height:2px;opacity:0;pointer-events:none;}

  @media (max-width:420px){
    .settings{grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .field{padding:8px;}
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;700;800&display=swap">

<div class="console">
  <div class="brand"><b>Timing Light</b></div>

  <div class="facepanel">
    <div class="lights" id="lights">
      <div class="light" data-phase="g"><div class="bulb g" id="bulbG"></div><span id="labelG">6:00</span></div>
      <div class="light" data-phase="a"><div class="bulb a" id="bulbA"></div><span id="labelA">7:00</span></div>
      <div class="light" data-phase="r"><div class="bulb r" id="bulbR"></div><span id="labelR">8:00</span></div>
    </div>

    <div class="display" id="display" tabindex="0" role="button" aria-label="Start or pause timer">
      <div class="clock" id="clock">0:00</div>
      <div class="hint" id="hint">click to start</div>
    </div>

    <div class="controls">
      <button class="ctl primary" id="startBtn">Start</button>
      <button class="ctl" id="resetBtn">Reset</button>
      <button class="ctl" id="soundBtn" aria-pressed="true">🔔 Sound on</button>
      <button class="ctl" id="pipBtn">⧉ Float above slides</button>
    </div>

    <div class="soundpanel" id="soundpanel">
      <div class="volrow">
        <label for="volSlider">Volume</label>
        <input type="range" id="volSlider" min="0" max="100" value="55">
        <span id="volLabel">55%</span>
      </div>
      <select class="toneSelect" id="toneSelect" aria-label="Alert sound">
        <option value="bell" selected>Bell toll</option>
        <option value="chime">Soft chime</option>
        <option value="custom">Custom sound…</option>
      </select>
      <button class="ctl fileBtn" id="fileBtnWrap" style="display:none;">
        Choose file
        <input type="file" id="customFile" accept="audio/*">
      </button>
      <span id="customName"></span>
      <button class="ctl" id="testBtn">▶ Test</button>
    </div>
  </div>

  <div class="settings">
    <div class="field g">
      <label for="tG">Green at</label>
      <input id="tG" inputmode="numeric" value="6:00">
    </div>
    <div class="field a">
      <label for="tA">Yellow at</label>
      <input id="tA" inputmode="numeric" value="7:00">
    </div>
    <div class="field r">
      <label for="tR">Red at</label>
      <input id="tR" inputmode="numeric" value="8:00">
    </div>
  </div>

  <div class="foot">Tap the clock, or press <code>space</code>, to start and pause.</div>
</div>

<canvas id="pipCanvas" width="640" height="360"></canvas>
<video id="pipVideo" muted playsinline></video>

(function(){
  const clockEl = document.getElementById('clock');
  const hintEl = document.getElementById('hint');
  const displayEl = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const soundBtn = document.getElementById('soundBtn');
  const pipBtn = document.getElementById('pipBtn');
  const soundpanel = document.getElementById('soundpanel');
  const volSlider = document.getElementById('volSlider');
  const volLabel = document.getElementById('volLabel');
  const toneSelect = document.getElementById('toneSelect');
  const fileBtnWrap = document.getElementById('fileBtnWrap');
  const customFile = document.getElementById('customFile');
  const customName = document.getElementById('customName');
  const testBtn = document.getElementById('testBtn');
  const bulbs = { g: document.getElementById('bulbG'), a: document.getElementById('bulbA'), r: document.getElementById('bulbR') };
  const tG = document.getElementById('tG'), tA = document.getElementById('tA'), tR = document.getElementById('tR');
  const labelG = document.getElementById('labelG'), labelA = document.getElementById('labelA'), labelR = document.getElementById('labelR');

  const colors = { g:'#3ddc84', a:'#ffc53d', r:'#ff4d4d', none:'#e9ece8' };

  function parseMMSS(str){
    const m = String(str).trim().match(/^(\d+):([0-5]?\d)$/);
    if(!m) return null;
    return parseInt(m[1],10)*60 + parseInt(m[2],10);
  }
  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  }

  let thresholds = { g: 360, a: 420, r: 480 };
  function readThresholds(){
    const g = parseMMSS(tG.value), a = parseMMSS(tA.value), r = parseMMSS(tR.value);
    if(g!=null && a!=null && r!=null && g<=a && a<=r){
      thresholds = { g, a, r };
      labelG.textContent = fmt(g); labelA.textContent = fmt(a); labelR.textContent = fmt(r);
    }
  }
  [tG,tA,tR].forEach(inp=>{
    inp.addEventListener('change', readThresholds);
    inp.addEventListener('blur', readThresholds);
  });

  let elapsed = 0, running = false, lastTick = null, rafId = null;
  let lastPhase = 'none';
  let soundOn = true;

  let audioCtx = null;
  let volume = 0.55;
  let toneType = 'bell';
  let customBuffer = null;
  let customLoading = false;
  let bellBufferPromise = null;

  function getCtx(){
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  const tonebanks = {
    chime: { g:[740,880], a:[660,830], r:[520,660,520] }
  };

  function synth(freqs){
    const ctx = getCtx();
    const now = ctx.currentTime;
    const peak = 0.16 * volume;
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      const t0 = now + i*0.12;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(peak, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.4);
    });
  }

  function playBuffer(buf){
    const ctx = getCtx();
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    gain.gain.value = volume;
    src.buffer = buf;
    src.connect(gain).connect(ctx.destination);
    src.start();
  }

  function loadBellBuffer(){
    if(!bellBufferPromise){
      bellBufferPromise = (async () => {
        const ctx = getCtx();
        const bin = atob(BELL_B64);
        const bytes = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
        return await ctx.decodeAudioData(bytes.buffer);
      })();
    }
    return bellBufferPromise;
  }

  function playTone(phase){
    if(!soundOn) return;
    try{
      if(toneType === 'custom' && customBuffer){
        playBuffer(customBuffer);
      } else if(toneType === 'chime'){
        const bank = tonebanks.chime;
        synth(bank[phase] || bank.g);
      } else {
        loadBellBuffer().then(playBuffer).catch(() => synth(tonebanks.chime[phase] || tonebanks.chime.g));
      }
    }catch(e){}
  }
  function chime(phase){ playTone(phase); }

  function phaseFor(sec){
    if(sec >= thresholds.r) return 'r';
    if(sec >= thresholds.a) return 'a';
    if(sec >= thresholds.g) return 'g';
    return 'none';
  }

  function render(){
    clockEl.textContent = fmt(elapsed);
    const phase = phaseFor(elapsed);
    clockEl.classList.remove('g','a','r','over');
    Object.values(bulbs).forEach(b => b.classList.remove('on'));
    if(phase !== 'none'){
      clockEl.classList.add(phase);
      bulbs[phase].classList.add('on');
    }
    if(elapsed >= thresholds.r){
      clockEl.classList.add('over');
    }
    if(phase !== lastPhase && phase !== 'none'){
      chime(phase);
      lastPhase = phase;
    } else if(phase !== lastPhase){
      lastPhase = phase;
    }
    hintEl.textContent = running ? 'click to pause' : (elapsed > 0 ? 'click to resume' : 'click to start');
    drawPip(phase);
  }

  function tick(ts){
    if(lastTick == null) lastTick = ts;
    const dt = (ts - lastTick) / 1000;
    lastTick = ts;
    if(running){
      elapsed += dt;
      render();
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  function toggleRun(){
    running = !running;
    lastTick = null;
    startBtn.textContent = running ? 'Pause' : 'Start';
    if(running){
      try{ getCtx(); loadBellBuffer(); }catch(e){}
    }
    render();
  }
  function reset(){
    running = false;
    elapsed = 0;
    lastPhase = 'none';
    lastTick = null;
    startBtn.textContent = 'Start';
    render();
  }

  displayEl.addEventListener('click', toggleRun);
  displayEl.addEventListener('keydown', e => { if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); toggleRun(); }});
  startBtn.addEventListener('click', toggleRun);
  resetBtn.addEventListener('click', reset);
  document.addEventListener('keydown', e => {
    if(e.target && (e.target.tagName === 'INPUT')) return;
    if(e.code === 'Space'){ e.preventDefault(); toggleRun(); }
  });

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔔 Sound on' : '🔕 Sound off';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundpanel.classList.toggle('muted', !soundOn);
  });

  volSlider.addEventListener('input', () => {
    volume = Number(volSlider.value) / 100;
    volLabel.textContent = volSlider.value + '%';
  });

  toneSelect.addEventListener('change', () => {
    toneType = toneSelect.value;
    fileBtnWrap.style.display = (toneType === 'custom') ? '' : 'none';
  });

  customFile.addEventListener('change', async () => {
    const file = customFile.files && customFile.files[0];
    if(!file) return;
    customName.textContent = file.name;
    customLoading = true;
    try{
      const arrayBuf = await file.arrayBuffer();
      const ctx = getCtx();
      customBuffer = await ctx.decodeAudioData(arrayBuf);
    }catch(e){
      customBuffer = null;
      customName.textContent = file.name + ' — could not read this file';
    }
    customLoading = false;
  });

  testBtn.addEventListener('click', () => playTone('g'));

  const pipCanvas = document.getElementById('pipCanvas');
  const pipCtx = pipCanvas.getContext('2d');
  const pipVideo = document.getElementById('pipVideo');
  let pipStream = null;

  function drawPip(phase){
    const w = pipCanvas.width, h = pipCanvas.height;
    const bg = '#0b0e10';
    pipCtx.fillStyle = bg;
    pipCtx.fillRect(0,0,w,h);
    const dim = { g:'#123321', a:'#3a2c0c', r:'#3a1010', none:'#101414' }[phase];
    pipCtx.fillStyle = dim;
    pipCtx.fillRect(0,0,w,10);
    pipCtx.fillRect(0,h-10,w,10);

    const dotY = 44, dotR = 11, gap = 46;
    const cx = w/2;
    const order = ['g','a','r'];
    order.forEach((p, i) => {
      const x = cx + (i-1)*gap*2.1;
      pipCtx.beginPath();
      pipCtx.arc(x, dotY, dotR, 0, Math.PI*2);
      pipCtx.fillStyle = (p === phase) ? colors[p] : '#262c2e';
      pipCtx.fill();
      if(p === phase){
        pipCtx.shadowColor = colors[p];
        pipCtx.shadowBlur = 18;
        pipCtx.fill();
        pipCtx.shadowBlur = 0;
      }
    });

    pipCtx.fillStyle = colors[phase] || colors.none;
    pipCtx.font = "700 128px 'JetBrains Mono', monospace";
    pipCtx.textAlign = 'center';
    pipCtx.textBaseline = 'middle';
    const overtime = elapsed >= thresholds.r;
    const blink = overtime && (Math.floor(elapsed*2) % 2 === 0);
    pipCtx.globalAlpha = (overtime && !blink) ? 0.35 : 1;
    pipCtx.fillText(fmt(elapsed), w/2, h/2 + 30);
    pipCtx.globalAlpha = 1;
  }
  drawPip('none');

  pipStream = pipCanvas.captureStream(15);
  pipVideo.srcObject = pipStream;
  pipVideo.play().catch(() => {});

  pipBtn.addEventListener('click', async () => {
    try{
      if(document.pictureInPictureElement){
        await document.exitPictureInPicture();
        return;
      }
      if(pipVideo.readyState < 2){
        await new Promise((resolve) => {
          pipVideo.addEventListener('loadeddata', resolve, { once: true });
          setTimeout(resolve, 1000);
        });
      }
      await pipVideo.requestPictureInPicture();
    }catch(err){
      alert('Picture-in-Picture isn\'t available here. Try opening this page in its own browser tab (not embedded) using Chrome or Safari.');
    }
  });
  pipVideo.addEventListener('leavepictureinpicture', () => {});

  render();
})();
</script>
